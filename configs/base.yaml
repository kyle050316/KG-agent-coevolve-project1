# Shared defaults = the simplified main design (configs/main.yaml only sets the work dir).
# pilot.yaml shrinks it for a smoke test on real data; extended.yaml adds the optional parts.
# The resolved config of every run is saved to <work_dir>/config.resolved.yaml (pre-registration).
seed: 20261123

paths:
  kqapro_dir: data/kqapro            # kb.json, train.json, val.json (official KQA Pro release)
  kilt_source: http://dl.fbaipublicfiles.com/KILT/kilt_knowledgesource.json   # or a local path
  kilt_pages: data/kilt/kb_pages.jsonl                                        # pages of KB entities only
  work_dir: runs/default

llm:
  default:                           # Qwen3.5-9B served by vLLM (scripts/serve_vllm.sh)
    base_url: http://localhost:8000/v1
    api_key: EMPTY
    model: Qwen/Qwen3.5-9B
    temperature: 0.7                 # model-card values for non-thinking (instruct) mode
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
    max_tokens: 1024
    enable_thinking: false
    vllm_extras: true
    concurrency: 32
  challenger:                        # greedy decoding: one deterministic decision per path / entity
    temperature: 0.0
    top_p: 1.0
    presence_penalty: 0.0
  solver: {}
  curator: {}
  judge:                             # prefer a different model family (e.g. an API model) to avoid self-preference
    temperature: 0.0
    top_p: 1.0
    presence_penalty: 0.0
    max_tokens: 256

docs:
  max_words: 100                     # passage length

region:
  concept: human                     # biographies have the richest text support
  n_a: 200                           # Exp 1 entities
  n_b: 200                           # Exp 2 entities (need KQA Pro question coverage)
  min_facts: 8
  min_page_words: 150
  min_questions_b: 3
  n_b_extra: 0                       # more B entities, added after A and the first n_b (configs/exp2.yaml)

support:
  audit_n: 50                        # human precision check of S (target precision >= 95%)

defects:
  rate: 0.3                          # share of S facts of region A that are deleted or corrupted
  seeds: [0]
  delete_frac: 0.5
  similar_frac: 0.5                  # share of type-consistent ("similar") corruptions

paths_sampling:                      # directed sampling, shared by all conditions (see kb/paths.py DirectedSampler)
  n_defective: 100                   # paths through a corrupted fact whose G* answer differs from the Gw answer
  n_clean: 100                       # paths with no changed fact, first hop in S, same answer on Gw and G*
  max_per_defect: 2                  # paths per corrupted fact (a second one only if the first pass falls short)
  type_weights: {attr: 0.15, rel: 0.15, attr_qual: 0.05, rel_qual: 0.1, rel_attr: 0.3, rel_rel: 0.15, rel_relqual: 0.1}

exp1:
  # B0 = no-LLM template baseline; C1 = KG only; C1know = KG only + the Challenger's own knowledge;
  # C2 = KG + documents (the gold passages of S are always shown, mixed with distractor passages);
  # C3 = KG + reference KG (oracle). Only C1know may use background knowledge.
  # Reporting is counts only; statistical tests are to be added later.
  evidence: {k_per_fact: 3, mode_b_distractors: 4}   # C2 Mode A: gold + BM25 distractors = 3 passages per path fact;
                                                     # C2 Mode B: all S passages of the entity + 4 other page passages
  probe: {enabled: false, k: 2}      # optional C0 closed-book probe of every S fact (adds "known" strata)
  mode_a: {conditions: [B0, C1, C1know, C2, C3], samples: 1}
  mode_b: {conditions: [C1, C1know, C2, C3], n_entities: 100, samples: 1}
  gap_tasks: {max_per_entity: 1}
  judge: {max_tasks: null}           # judge every task; the judge is the same model (only one model is available)
  solver: {n_per_group: 40, k: 8, settings: [gw, gstar, closed], max_attempts: 2, fewshot_pool: 20000}
                                     # n_per_group tasks per (condition, source: mode_a | gap), k samples per setting
  audit: {e3_n: 60}                  # optional human audit of the judge

exp2:
  # Case classes: missing_fact, wrong_fact (one sandboxed defect on a gold-path fact), non_kg, and from Exp 1
  # Challenger tasks bad_key (wrong key, KG right); the Curator diagnoses one of the four.
  # Triggers: T1 = Solver answer stably wrong; T2 = Solver KG execution stably misses the answer key.
  pool_size: 1000                    # KQA Pro questions on region B entities run on G*
  k: 4                               # Solver samples per question / case for stable labels
  stable_hi: 0.75                    # stably correct: >= 3/4
  stable_lo: 0.25                    # stably wrong:   <= 1/4
  targets: {missing_fact: 100, wrong_fact: 100, non_kg: 100}
  challenger_cases:                  # cases from Exp 1 Mode A tasks, whose keys can be wrong (bad_key etc.)
    sources: [{work_dir: null, seed: 0}]   # Exp 1 runs: work dir (exp1/tasks.jsonl, data/paths, data/gw; null = this
                                     # one) and defect seed
    n_per_class: 30                  # per kind: bad_key, key and KG wrong, key right and KG wrong (control)
  ablations: [full, no_tool]         # full = diagnose -> sandbox re-run as a tool -> commit/revise/withdraw
  ablation_n: 100                    # stratified cases for ablations other than full
  samples: 1                         # Curator seeds for the full ablation
  evidence_k: 6
  locality_n: 100                    # neighbour questions per admitted edit (program level, exact)
  solver_locality_edits: 20          # admitted edits re-tested at Solver level
  solver_locality_questions: 30      # neighbour questions per re-tested edit
