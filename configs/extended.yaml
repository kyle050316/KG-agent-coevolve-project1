# Optional extensions, if time allows after the main run: the C0 closed-book probe, more paths and
# Mode B entities in Exp 1; a second Curator seed and the no_docs ablation in Exp 2.
# Run with the "probe" stage added (prepare and exp1). Uses its own work dir.
extends: base.yaml
paths:
  work_dir: runs/extended
paths_sampling:
  n_defective: 150
  n_clean: 150
exp1:
  probe: {enabled: true, k: 2}
  mode_b: {conditions: [C1, C1know, C2, C3], n_entities: 200, samples: 1}
exp2:
  pool_size: 1500
  targets: {missing_fact: 150, wrong_fact: 150, non_kg: 150}
  ablations: [full, no_tool, no_docs]
  samples: 2
