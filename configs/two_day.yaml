# Two-day plan, time-limited (compute units are not the constraint):
# minimal Exp 1 (C1/C2/C3 + free B0) and a reduced Exp 2, in ONE work dir so Exp 2 can use Exp 1 tasks.
extends: exp1_min.yaml
paths:
  work_dir: runs/two_day
exp2:
  pool_size: 1000
  k: 4
  targets: {missing_fact: 100, wrong_fact: 100, non_kg: 100, invalid_task: 50, non_kg_offpath: 50, refer: 50}
  variants: [gold, pipeline]
  ablations: [full, no_sandbox, no_docs]
  ablation_n: 100
  samples: 1
  solver_locality_edits: 20
  solver_locality_questions: 30
