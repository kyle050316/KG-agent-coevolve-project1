[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgcoevo"
version = "0.1.0"
description = "KG-Agent co-evolution, Project 1: Exp 1 (Challenger task validity / gap discovery) and Exp 2 (Curator failure attribution and KG repair) on KQA Pro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "KoPL==0.0.5",
  "openai>=1.40",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kgcoevo = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
